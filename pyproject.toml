[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claude-gateway-extensions"
dynamic = ["version"]
description = "Gateway extensions for Claude Code: a local gateway with cache bumping, and more to come"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "NubeBuster" }]
keywords = ["claude", "claude-code", "prompt-caching", "proxy", "gateway"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = ["aiohttp>=3.9,<4", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[project.scripts]
cgx = "claude_gateway_extensions.cli:main"

[project.urls]
Homepage = "https://github.com/NubeBuster/claude-gateway-extensions"
Issues = "https://github.com/NubeBuster/claude-gateway-extensions/issues"

[tool.hatch.version]
path = "src/claude_gateway_extensions/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_gateway_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"claude/skills/cache" = "claude_gateway_extensions/data/skills/cache"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "claude", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
  "D203", # one-blank-line-before-class: conflicts with D211
  "D213", # multi-line-summary-second-line: conflicts with D212
  "ANN401", # Any in signatures is sometimes the honest type for JSON
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
